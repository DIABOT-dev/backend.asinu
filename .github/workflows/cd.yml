name: Doctor two synthetic cases
run-name: Doctor two cases inspect

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [inspect]
        default: inspect

permissions:
  contents: read

concurrency:
  group: doctor-two-cases-20261019
  cancel-in-progress: false

jobs:
  doctor-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the intended Doctor account with the existing administration key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          test "$VPS_HOST" = '36.50.176.55'
          task_dir="$(mktemp -d)"
          trap 'rm -rf "$task_dir"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          printf '%s\n' '36.50.176.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMDOm8XUn1KYdgS2UTE7r4XyrFpWQKpg7Kh+ZdWOm5xL' > "$task_dir/known_hosts"
          ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'docker exec -i asinu-doctor-backend node - inspect' \
            < scripts/doctor-two-cases.cjs
