name: Backend CD

on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, inspect SSH, or remove a confirmed operator IP ban
        type: choice
        options:
          [
            deploy,
            ssh-diagnostics,
            prepare-auto-deploy,
            notification-audit,
            checkin-audit,
            enable-checkin-conclusion,
            checkin-audio-probe,
            checkin-audio-only-probe,
            restore-operator-ssh,
          ]
        default: deploy
      lookup_name:
        description: Name to find during a read-only check-in audit
        required: false
      lookup_phone:
        description: Phone to inspect during a read-only check-in audit
        required: false
      operator_ip:
        description: Confirmed operator IPv4 address to unban (restore operation only)
        required: false
      environment:
        description: Deployment environment
        type: choice
        options: [camp, prod]
        default: camp
      ref:
        description: Git branch, tag, or SHA to package
        required: false
        default: main
      deploy:
        description: Deploy after publishing the image
        type: boolean
        default: true

concurrency:
  group: backend-cd-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ssh-diagnostics:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'ssh-diagnostics' || inputs.operation == 'prepare-auto-deploy' || inputs.operation == 'notification-audit' || inputs.operation == 'checkin-audit' || inputs.operation == 'enable-checkin-conclusion' || (inputs.operation == 'checkin-audio-probe' || inputs.operation == 'checkin-audio-only-probe') || inputs.operation == 'restore-operator-ssh')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout read-only audit
        if: inputs.operation == 'prepare-auto-deploy' || inputs.operation == 'notification-audit' || inputs.operation == 'checkin-audit' || inputs.operation == 'enable-checkin-conclusion' || (inputs.operation == 'checkin-audio-probe' || inputs.operation == 'checkin-audio-only-probe')
        uses: actions/checkout@v7
      - name: Inspect SSH and API status with the existing administration key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          OPERATION: ${{ inputs.operation }}
          OPERATOR_IP: ${{ inputs.operator_ip }}
          STACK_DIR: ${{ vars.STACK_DIR || '/opt/asinu-backend' }}
          LOOKUP_NAME: ${{ inputs.lookup_name }}
          LOOKUP_PHONE: ${{ inputs.lookup_phone }}
        run: |
          set -eu
          test "$VPS_HOST" = '36.50.176.55'
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          if [ "$OPERATION" = 'restore-operator-ssh' ]; then
            python3 -c 'import ipaddress, os; ipaddress.IPv4Address(os.environ["OPERATOR_IP"])'
          else
            OPERATOR_IP='-'
          fi
          task_dir="$(mktemp -d)"
          trap 'rm -rf "$task_dir"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          printf '%s\n' '36.50.176.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMDOm8XUn1KYdgS2UTE7r4XyrFpWQKpg7Kh+ZdWOm5xL' > "$task_dir/known_hosts"
          stack_dir_b64="$(printf '%s' "$STACK_DIR" | base64 | tr -d '\n')"
          if [ "$OPERATION" = 'prepare-auto-deploy' ]; then
            ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" python3 - "$stack_dir_b64" < deploy/prepare-auto-deploy.py
            exit 0
          fi
          ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" sh -s -- "$OPERATION" "$OPERATOR_IP" "$stack_dir_b64" <<'REMOTE'
          set -eu
          if [ "$1" = 'restore-operator-ssh' ]; then
            fail2ban-client set sshd unbanip "$2"
          fi
          systemctl is-active ssh
          /usr/sbin/sshd -t
          ss -lnt 'sport = :22'
          fail2ban-client status sshd 2>/dev/null || true
          docker ps --format '{{.Names}} {{.Status}}'
          docker inspect asinu-backend --format 'Image={{.Config.Image}} ComposeDir={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          active_dir="$(docker inspect asinu-backend --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')"
          docker inspect asinu-backend --format 'ComposeFiles={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          docker inspect asinu-backend --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
          stack_dir="$(printf '%s' "$3" | base64 -d)"
          test -d "$stack_dir"
          ready=1
          required_files='.env .env.migrations'
          if [ -f "$stack_dir/runtime.compose.json" ]; then
            required_files='runtime.compose.json migration.compose.json'
          fi
          for name in $required_files; do
            if [ -f "$stack_dir/$name" ]; then
              printf 'Deployment file present: %s/%s\n' "$stack_dir" "$name"
            else
              printf 'Deployment file missing: %s/%s\n' "$stack_dir" "$name"
              ready=0
            fi
          done
          docker inspect asinu-backend --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(CHECKIN_DETAILED_QUESTIONS_ENABLED|CHECKIN_ADAPTIVE_QUESTIONS_ENABLED|CHECKIN_CONCLUSION_V2_ENABLED|CHECKIN_STRUCTURED_CONCLUSION_ENABLED|AI_PROVIDER_CLINICAL|KEY_MANAGEMENT_PROVIDER)=' || true
          docker exec asinu-backend node -e '
            const probe = require("node:child_process").spawnSync("ffmpeg", ["-version"], {encoding:"utf8"});
            console.log(JSON.stringify({audio_runtime:{ffmpeg_present:probe.status===0,
              ffmpeg_version:probe.status===0 ? probe.stdout.split("\n")[0] : null,
              audio_format:process.env.CHECKIN_CALL_AUDIO_FORMAT || null,
              vieneu_timeout_ms:process.env.VIENEU_TIMEOUT_MS || null}}));
          '
          curl -fsS --max-time 5 http://127.0.0.1:3300/api/healthz
          test "$ready" -eq 1
          REMOTE
          if [ "$OPERATION" = 'notification-audit' ]; then
            ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'docker exec -i asinu-backend node' < deploy/notification-audit.cjs
          fi
          if [ "$OPERATION" = 'checkin-audit' ]; then
            lookup64="$(node -e 'process.stdout.write(Buffer.from(JSON.stringify({name:process.env.LOOKUP_NAME,phone:process.env.LOOKUP_PHONE})).toString("base64"))')"
            ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" "docker exec -i asinu-backend node - '$lookup64'" < deploy/checkin-preview-audit.cjs
          fi
          if [ "$OPERATION" = 'checkin-audio-probe' ] || [ "$OPERATION" = 'checkin-audio-only-probe' ]; then
            if [ "$OPERATION" = 'checkin-audio-probe' ]; then
              ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
                "$VPS_USER@$VPS_HOST" 'docker exec -i asinu-backend node' < deploy/checkin-conclusion-probe.cjs
            fi
            ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'docker exec -i asinu-backend node' < deploy/checkin-full-audio-probe.cjs
          fi
          if [ "$OPERATION" = 'enable-checkin-conclusion' ]; then
            for phase in preflight release verify; do
              if [ "$phase" = 'release' ]; then
                remote_command='python3 -'
                script='deploy/enable-checkin-conclusion.py'
              else
                remote_command='docker exec -i asinu-backend node -'
                if [ "$phase" = 'preflight' ]; then remote_command="$remote_command --preflight"; fi
                script='deploy/checkin-conclusion-probe.cjs'
              fi
              ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
                -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
                "$VPS_USER@$VPS_HOST" "$remote_command" < "$script"
            done
          fi

  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == '')) ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Resolve source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${INPUT_REF:-main}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve image metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="$(git rev-parse HEAD)"
          echo "image=${image}:${sha}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repository=$image" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package summary
        run: |
          {
            echo "### Backend package"
            echo "- Image: ${{ steps.meta.outputs.image }}"
            echo "- Commit: ${{ steps.meta.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: package
    if: >-
      needs.package.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'workflow_run' && vars.AUTO_DEPLOY_PROD == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    env:
      STACK_DIR: ${{ vars.STACK_DIR || '/opt/asinu-backend' }}
      BASE_URL: ${{ vars.BASE_URL }}
      HOST_PORT: ${{ vars.HOST_PORT || '3300' }}

    steps:
      - name: Require deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing environment secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout deployment files
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.sha }}

      - name: Deploy and verify with OpenSSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ASINU_BACKEND_IMAGE: ${{ needs.package.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
        run: |
          set -euo pipefail
          test "$VPS_HOST" = '36.50.176.55'
          [[ "$STACK_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$HOST_PORT" =~ ^[0-9]+$ ]]
          umask 077
          task_dir="$(mktemp -d)"
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          printf '%s\n' '36.50.176.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMDOm8XUn1KYdgS2UTE7r4XyrFpWQKpg7Kh+ZdWOm5xL' > "$task_dir/known_hosts"
          ssh_args=(-i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$task_dir/known_hosts" -o ConnectTimeout=15)
          target="${VPS_USER}@${VPS_HOST}"
          ssh "${ssh_args[@]}" "$target" bash -se -- "$STACK_DIR" <<'REMOTE'
          umask 077
          mkdir -p "$1/.deploy-history"
          cd "$1"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          for name in docker-compose.yml docker-compose.openbao.yml runtime.compose.json migration.compose.json; do
            if [ -f "$name" ]; then cp -p "$name" ".deploy-history/pre-${stamp}-${name}"; fi
          done
          REMOTE
          ssh "${ssh_args[@]}" "$target" "mkdir -p '$STACK_DIR/.deploy-tools'"
          tar -C deploy -cf - prepare-auto-deploy.py |
            ssh "${ssh_args[@]}" "$target" "tar --no-same-owner -xf - -C '$STACK_DIR/.deploy-tools'"
          tar -C deploy -cf - docker-compose.yml docker-compose.openbao.yml |
            ssh "${ssh_args[@]}" "$target" "tar --no-same-owner -xf - -C '$STACK_DIR'"
          {
            printf 'export ASINU_BACKEND_IMAGE=%q\n' "$ASINU_BACKEND_IMAGE"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export STACK_DIR=%q\n' "$STACK_DIR"
            printf 'export HOST_PORT=%q\n' "$HOST_PORT"
            printf 'export DEPLOY_ENV=%q\n' "$DEPLOY_ENV"
            cat deploy/rollout-backend.sh
          } | ssh "${ssh_args[@]}" "$target" bash -se
          deployed_image="$(ssh "${ssh_args[@]}" "$target" docker inspect asinu-backend --format '{{.Config.Image}}')"
          test "$deployed_image" = "$ASINU_BACKEND_IMAGE"
          printf 'Production container revision verified: %s\n' "$deployed_image"

      - name: Verify public endpoint
        if: env.BASE_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 "${BASE_URL%/}/api/readyz" >/dev/null

      - name: Deployment summary
        run: |
          {
            echo "### Backend deployment"
            echo "- Environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}"
            echo "- Image: ${{ needs.package.outputs.image }}"
          } >> "$GITHUB_STEP_SUMMARY"
