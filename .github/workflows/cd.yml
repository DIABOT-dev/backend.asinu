name: Doctor frontend release e25aa84
run-name: Deploy Doctor e25aa84 frontend only

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [doctor-frontend]
        default: doctor-frontend

permissions:
  contents: read

concurrency:
  group: doctor-production-frontend
  cancel-in-progress: false

jobs:
  deploy-doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the verified Doctor frontend, with canary and rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          test "$VPS_HOST" = '36.50.176.55'
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          task_dir="$(mktemp -d)"
          trap 'rm -rf "$task_dir"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          printf '%s\n' '36.50.176.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMDOm8XUn1KYdgS2UTE7r4XyrFpWQKpg7Kh+ZdWOm5xL' > "$task_dir/known_hosts"
          printf '%s\n' 'd76b12bb8cefb34d9194e7e708b2429933a9057272852f2b09c0da42445bd79d  scripts/deploy-doctor-e25aa84.py' | sha256sum -c -
          scp -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            scripts/deploy-doctor-e25aa84.py "$VPS_USER@$VPS_HOST:/tmp/asinu-doctor-deploy-e25aa84.py"
          ssh -T -i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$task_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" 'python3 /tmp/asinu-doctor-deploy-e25aa84.py'
