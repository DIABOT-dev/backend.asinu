name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: asinu_test
          POSTGRES_USER: asinu
          POSTGRES_PASSWORD: asinu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asinu -d asinu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      LOG_LEVEL: error
      DATABASE_URL: postgresql://asinu:asinu_test@127.0.0.1:5432/asinu_test
      CHECKIN_TEST_DATABASE_URL: postgresql://asinu:asinu_test@127.0.0.1:5432/asinu_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (advisory until baseline is clean)
        run: npm run format:check
        continue-on-error: true

      - name: Apply all database migrations
        run: node scripts/migrate.js

      - name: Test all suites, including PostgreSQL integration
        run: npm test

      - name: Syntax check server entry
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: asinu-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
