# Drop-in for systemd-cryptsetup@asinu_data.service on VPS 36.
# crypttab and fstab must mark this as _netdev to avoid early-boot ordering cycles.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/asinu-openbao/unlock-volume.py --config /etc/asinu/openbao/volume-config.json
TimeoutStartSec=90
LimitCORE=0
MemorySwapMax=0
