services:
  asinu-backend:
    image: ${ASINU_BACKEND_IMAGE:?ASINU_BACKEND_IMAGE is required}
    container_name: asinu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HEALTH_FIELD_ENCRYPTION_ENABLED: 'true'
      HEALTH_FIELD_KEY_DIRECTORY: /run/asinu-health-keys
    command: ['node', 'server.js']
    volumes:
      - type: bind
        source: ${HEALTH_FIELD_KEY_HOST_DIRECTORY:?HEALTH_FIELD_KEY_HOST_DIRECTORY is required}
        target: /run/asinu-health-keys
        bind:
          create_host_path: false
      - type: bind
        source: ${DB_TLS_CA_HOST_FILE:?DB_TLS_CA_HOST_FILE is required}
        target: /run/asinu-db-tls/ca.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:${HOST_PORT:-3300}:3000'
    networks:
      - asinu_net

  asinu-migrate:
    profiles: ['migration']
    image: ${ASINU_BACKEND_IMAGE:?ASINU_BACKEND_IMAGE is required}
    restart: 'no'
    env_file:
      - .env.migrations
    command: ['node', 'scripts/migrate.js']
    volumes:
      - type: bind
        source: ${DB_TLS_CA_HOST_FILE:?DB_TLS_CA_HOST_FILE is required}
        target: /run/asinu-db-tls/ca.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      disable: true
    networks:
      - asinu_net

networks:
  asinu_net:
    external: true
